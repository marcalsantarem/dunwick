<script>
'use strict';
// =====================================================================
// CONFIG

const ENEMY_TYPES = {

  alpha: { hp: 250, dmg: 18, speed: PLAYER_STATS.runSpeed * 1.05, patrolSpeed: 1.3, radius: 0.48, xp: 150, scale: 1.5, sight: 9, range: 1.4, boss: true },
  boar:  { hp: 55,  dmg: 12, speed: 5.5, patrolSpeed: 1.0, radius: 0.38, xp: 20, scale: 1.0, sight: 5, range: 0.9 },
  // Fase 3: lobo acuado (foge; só morde encurralado) e o javali-rei Couro-Queimado
  cornered: { hp: 34, dmg: 9, speed: 3.6, patrolSpeed: 1.0, radius: 0.32, xp: 15, scale: 1.0, sight: 6, range: 1.0 },

// =====================================================================
// UTILITÁRIOS (matemática, ruído, isometria, cores)
// =====================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const smooth = t => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let srand = mulberry32(CFG.SEED);
function sr(a, b) { return a + srand() * (b - a); }

function hash2(x, y, k = 0) {
  let h = (x * 374761393 + y * 668265263 + k * 2147483647 + CFG.SEED * 97) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// Value noise com tabela de reticulado
const NOISE_N = 256;
const noiseTab = new Float32Array(NOISE_N * NOISE_N);
(function () { const r = mulberry32(CFG.SEED ^ 0x5eed); for (let i = 0; i < noiseTab.length; i++) noiseTab[i] = r(); })();
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
  const a = noiseTab[y0 * NOISE_N + x0], b = noiseTab[y0 * NOISE_N + x1];
  const c = noiseTab[y1 * NOISE_N + x0], d = noiseTab[y1 * NOISE_N + x1];
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return (a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v;
}
function fbm(x, y, oct = 3) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += vnoise(x * f, y * f) * a; n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}

// Isometria 2:1
const HW = CFG.TILE_W / 2, HH = CFG.TILE_H / 2;
function worldToScreen(x, y) { return { x: (x - y) * HW, y: (x + y) * HH }; }
function screenToWorld(sx, sy) { return { x: (sx / HW + sy / HH) / 2, y: (sy / HH - sx / HW) / 2 }; }
// direção de tela -> vetor de mundo normalizado
function screenDirToWorld(dx, dy) {
  const w = screenToWorld(dx * HW, dy * HH * 2);
  const l = Math.hypot(w.x, w.y) || 1;
  return { x: w.x / l, y: w.y / l };
}
// vetor de mundo -> índice de direção (0=L,1=SE,2=S,3=SO,4=O,5=NO,6=N,7=NE)
function dirFromWorld(vx, vy) {
  const sx = (vx - vy) * HW, sy = (vx + vy) * HH;
  const a = Math.atan2(sy, sx);
  return ((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8;
}
// vetor unitário de mundo para cada direção de tela
const DIR_VEC = [];
for (let i = 0; i < 8; i++) {
  const a = i * Math.PI / 4;
  DIR_VEC.push(screenDirToWorld(Math.cos(a), Math.sin(a)));
}
// 8 direções -> (sprite base de 5, espelhado?)  base: 0=S,1=SE,2=L,3=NE,4=N
const DIR8_TO5 = [[2, false], [1, false], [0, false], [1, true], [2, true], [3, true], [4, false], [3, false]];

// Cores
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbToHex(r, g, b) { return '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1); }
function shade(hex, amt) { const [r, g, b] = hexToRgb(hex); return amt >= 0 ? rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt) : rgbToHex(r * (1 + amt), g * (1 + amt), b * (1 + amt)); }
function mixHex(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }

function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function ellipse(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU); }
function line(c, x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }

// Canvas principal
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let UIS = 1, UI_SCALE = 1;   // escala da interface em telas pequenas / escala ativa ao desenhar a UI
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  UIS = clamp(Math.min(W, H) / 640, 0.55, 1);
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
resize();
// =====================================================================
// GERAÇÃO DE ASSETS — PERSONAGENS (sprites montados por partes)
// Cada parte é posicionada num espaço 3D local (f = frente, l = lado
// direito, u = altura) e projetada para a tela conforme a direção.
// =====================================================================
const DIR5_SIDE = [0, 0.707, 1, 0.707, 0];
const DIR5_FRONT = [1, 0.707, 0, -0.707, -1];

function makeProj(dir5) {
  const s = DIR5_SIDE[dir5], fr = DIR5_FRONT[dir5];
  const P = (f, l, u) => ({ x: f * s - l * fr, y: -u + (f * fr + l * s) * 0.5, d: f * fr + l * s });
  P.side = s; P.front = fr;
  return P;
}

// membro grosso com contorno
function limb(c, pts, w, col, outline = PAL.outline) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
  c.strokeStyle = outline; c.lineWidth = w + 2; c.stroke();
  c.strokeStyle = col; c.lineWidth = w; c.stroke();
}
function hull(points) {
  const p = points.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up);
}
function fillPoly(c, pts, fill, stroke = PAL.outline, lw = 1) {
  c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y); c.closePath();
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
}
const add3 = (a, b) => ({ f: a.f + b.f, l: a.l + b.l, u: a.u + b.u });

const HERO_COL = {
  leather: '#7A2424', leatherHi: '#9C3A32', leatherDk: '#541717',
  metal: '#A9B1BA', metalHi: '#E6EAEE', metalDk: '#69717B',
  pants: '#3A3440', boots: '#5A3A22', bootsHi: '#7A5232', belt: '#5A3A1E',
  skin: '#E9B98F', skinDk: '#C48A64', hair: '#8E3B1F', hairHi: '#B8562C',
  blade: '#C9CFD7', edge: '#FFFFFF', grip: '#4A2E1A', capeC: PAL.red[0], capeDk: '#7A1A1E',
  sword: true, cape: true, hat: false, shoulders: true,
};
const VILLAGER_COL = Object.assign({}, HERO_COL, {
  leather: '#7A5A3A', leatherHi: '#94714C', leatherDk: '#5A4028', pants: '#4E4032', boots: '#3E2C1C', bootsHi: '#5A4030',
  belt: '#3A2A1A', hair: '#9A948A', hairHi: '#BDB8AE', sword: false, cape: false, hat: true, shoulders: false,
});

const MIRA_COL = Object.assign({}, HERO_COL, {
  leather: '#8E9A4E', leatherHi: '#A8B266', leatherDk: '#6A7436', pants: '#6A5236', boots: '#5A3E26', bootsHi: '#7A5A3A', belt: '#5A4A2A',
  hair: '#6A4426', hairHi: '#8E6236', hairStyle: 'braid', scarf: '#E8C23A', cape: false, shoulders: false, scale: 0.78,
  prop: 'broom', propLen: 26, restDir: { f: 0.15, l: 0.15, u: 0.97 },
});
const BRUNA_COL = Object.assign({}, HERO_COL, {
  leather: '#4A3426', leatherHi: '#5E4432', leatherDk: '#33231A', sleeve: '#7A7A80', pants: '#3A3A40', boots: '#3A2A1E', bootsHi: '#5A4030', belt: '#2A1E14',
  skin: '#D9A07A', skinDk: '#B47E5A', hair: '#A8A49C', hairHi: '#D0CCC4', hairStyle: 'short', cape: false, shoulders: false, scale: 1.18,
  prop: 'hammer', propLen: 18, restDir: { f: -0.35, l: 0.35, u: 0.86 },
});

// pose padrão
function basePose() {
  return { bob: 0, lean: 0, legR: 0, legL: 0, liftR: 0, liftL: 0, armR: 0.15, armL: -0.1,
    sword: { mode: 'rest' }, wave: 0, flow: 0, crouch: 0, spin: 0, fall: 0, armsOut: 0 };
}

function drawHumanoid(c, dir5, pose, col) {
  const P = makeProj(dir5);
  const sgn = P.side > 0.1 ? 1 : 1;
  c.save();
  // morte: tomba a partir dos pés
  if (pose.fall) { c.rotate(-pose.fall * sgn); }
  // rolamento: gira em torno do centro do corpo
  if (pose.spin) {
    c.translate(0, -11);
    if (P.side > 0.3) c.rotate(pose.spin);
    else c.scale(1, 0.55 + 0.45 * Math.abs(Math.cos(pose.spin)));
    c.translate(0, 11);
  }
  const b = pose.bob, ln = pose.lean, cr = pose.crouch;
  const hipU = 17 + b - cr * 7, shU = 31 + b - cr * 11, headU = 40 + b - cr * 13;
  const parts = [];
  const legLen = hipU;
  // ---- pernas
  for (const side of [1, -1]) {
    const swing = side > 0 ? pose.legR : pose.legL;
    const lift = side > 0 ? pose.liftR : pose.liftL;
    const hip = { f: ln * 0.3, l: side * 3, u: hipU };
    const foot = { f: swing * 6 + cr * 2, l: side * 3.2, u: lift * 4 + cr * 3 };
    const knee = { f: (hip.f + foot.f) / 2 + 1.5 + lift * 2.5 + cr * 5, l: side * 3.1, u: (hip.u + foot.u) / 2 + cr * 1 };
    const hp = P(hip.f, hip.l, hip.u), kp = P(knee.f, knee.l, knee.u), fp = P(foot.f, foot.l, foot.u);
    const toe = P(foot.f + 3, foot.l, foot.u);
    parts.push({ d: hp.d - 0.2, fn: () => {
      limb(c, [hp, kp], 5.5, col.pants);
      limb(c, [kp, fp], 5, col.boots);
      limb(c, [fp, toe], 4.5, col.boots);
      c.strokeStyle = col.bootsHi; c.lineWidth = 1.2; line(c, kp.x - 1, kp.y + 1, kp.x - 1, kp.y + 3);
    } });
  }
  // ---- capa
  if (col.cape) {
    const cp = P(-4, 0, 0);
    parts.push({ d: cp.d - 0.1, fn: () => {
      const w = pose.wave, fl = pose.flow;
      const tl = P(ln - 2.5, -5, shU - 1), tr = P(ln - 2.5, 5, shU - 1);
      const br = P(ln - 4.5 - fl, 6.5, 11 + b + fl * 0.8 + w), bl = P(ln - 4.5 - fl, -6.5, 11 + b + fl * 0.8 - w);
      const mid = P(ln - 5 - fl, 0, 9 + b + fl * 0.8 + w * 1.5);
      c.beginPath(); c.moveTo(tl.x, tl.y); c.lineTo(tr.x, tr.y); c.lineTo(br.x, br.y);
      c.quadraticCurveTo(mid.x, mid.y + 2, bl.x, bl.y); c.closePath();
      const g = c.createLinearGradient(tl.x, tl.y, mid.x, mid.y);
      g.addColorStop(0, col.capeC); g.addColorStop(1, col.capeDk);
      c.fillStyle = g; c.fill(); c.strokeStyle = PAL.outline; c.lineWidth = 1; c.stroke();
    } });
  }
  // ---- tronco
  const torsoPts = [];
  for (const [f, l, u] of [[ln + 3.5, 0, shU - 1], [ln - 3, 0, shU - 1], [ln, 6, shU], [ln, -6, shU],
    [ln * 0.3 + 3.2, 0, hipU - 1], [ln * 0.3 - 3, 0, hipU - 1], [ln * 0.3, 4.6, hipU - 1], [ln * 0.3, -4.6, hipU - 1]]) torsoPts.push(P(f, l, u));
  parts.push({ d: -0.5, fn: () => {
    const h = hull(torsoPts);
    const top = P(ln, 0, shU), bot = P(0, 0, hipU);
    const g = c.createLinearGradient(top.x - 6, top.y, bot.x + 6, bot.y);
    g.addColorStop(0, col.leatherHi); g.addColorStop(0.6, col.leather); g.addColorStop(1, col.leatherDk);
    fillPoly(c, h, g);
    // costuras/placas de couro
    c.strokeStyle = rgba(col.leatherDk, 0.8); c.lineWidth = 1;
    const m1 = P(ln * 0.7, -4.5, shU - 7), m2 = P(ln * 0.7, 4.5, shU - 7);
    line(c, m1.x, m1.y, m2.x, m2.y);
    // cinto
    const belt = [];
    for (const [f, l, u] of [[ln * 0.3 + 3.4, 0, hipU + 2.4], [ln * 0.3 - 3.2, 0, hipU + 2.4], [ln * 0.3, 4.8, hipU + 2.4], [ln * 0.3, -4.8, hipU + 2.4],
      [ln * 0.3 + 3.4, 0, hipU - 0.2], [ln * 0.3 - 3.2, 0, hipU - 0.2], [ln * 0.3, 4.8, hipU - 0.2], [ln * 0.3, -4.8, hipU - 0.2]]) belt.push(P(f, l, u));
    fillPoly(c, hull(belt), col.belt);
    const bk = P(ln * 0.3 + 3.6, 0, hipU + 1.1);
    if (col.scarf) { const nk = P(ln, 0, shU + 0.5); c.fillStyle = col.scarf; ellipse(c, nk.x, nk.y, 6.2, 2.6); c.fill(); c.strokeStyle = PAL.outline; c.lineWidth = 0.8; c.stroke(); }
    if (bk.d > -0.5) { c.fillStyle = PAL.gold[0]; c.fillRect(bk.x - 1.8, bk.y - 1.5, 3.6, 3); c.fillStyle = PAL.gold[1]; c.fillRect(bk.x - 1.2, bk.y - 1.2, 1.2, 1.2); }
  } });
  // ---- braços
  const swordDir = (() => {
    const s = pose.sword;
    if (s.mode === 'h') { const t = s.a * Math.PI / 180; return { f: Math.cos(t), l: Math.sin(t), u: 0.12 }; }
    if (s.mode === 'v') { const t = s.a * Math.PI / 180; return { f: Math.sin(t), l: 0.15, u: Math.cos(t) }; }
    return col.restDir || { f: 0.5, l: 0.25, u: -0.83 };
  })();
  for (const side of [1, -1]) {
    const sh = { f: ln, l: side * 6, u: shU - 1 };
    let hand;
    if (side > 0 && col.sword && pose.sword.mode !== 'rest') {
      hand = add3(sh, { f: swordDir.f * 7 + 2, l: swordDir.l * 7 - 2, u: swordDir.u * 6 - 5 });
    } else {
      const a = side > 0 ? pose.armR : pose.armL;
      const out = pose.armsOut * 5;
      hand = add3(sh, { f: Math.sin(a) * 10, l: side * (1 + out), u: -Math.cos(a) * 10 + out });
    }
    const elbow = { f: (sh.f + hand.f) / 2 - 0.5, l: (sh.l + hand.l) / 2 + side * 0.8, u: (sh.u + hand.u) / 2 };
    const sp = P(sh.f, sh.l, sh.u), ep = P(elbow.f, elbow.l, elbow.u), hp = P(hand.f, hand.l, hand.u);
    const armD = Math.max(sp.d, hp.d * 0.6);
    parts.push({ d: armD, fn: () => {
      limb(c, [sp, ep], 4.5, col.sleeve || col.leather);
      limb(c, [ep, hp], 4, col.skin);
      c.fillStyle = col.skin; ellipse(c, hp.x, hp.y, 2.3, 2.3); c.fill(); c.strokeStyle = PAL.outline; c.lineWidth = 0.8; c.stroke();
      if (col.shoulders) {
        const g = c.createRadialGradient(sp.x - 1.5, sp.y - 2, 0.5, sp.x, sp.y, 5);
        g.addColorStop(0, col.metalHi); g.addColorStop(0.5, col.metal); g.addColorStop(1, col.metalDk);
        c.fillStyle = g; ellipse(c, sp.x, sp.y - 0.5, 4.6, 3.6); c.fill(); c.strokeStyle = PAL.outline; c.lineWidth = 1; c.stroke();
      }
    } });
    // ---- espada
    if (side > 0 && col.sword) {

// ponto 3D (tiles, tiles, px de altura) -> tela local
const Q = (x, y, z = 0) => ({ x: (x - y) * HW, y: (x + y) * HH - z });

// caixa isométrica simples centrada em (0,0) do chão
function isoBox(c, ox, oy, w, d, h, top, left, right, z0 = 0) {
  const T = (x, y, z) => { const p = Q(x - w / 2 + ox, y - d / 2 + oy, z); return p; };
  quad(c, T(0, d, z0), T(w, d, z0), T(w, d, z0 + h), T(0, d, z0 + h), left);
  quad(c, T(w, 0, z0), T(w, d, z0), T(w, d, z0 + h), T(w, 0, z0 + h), right);

// pequena textura de pedras num retângulo de uma face
function stoneCourse(c, F, u0, u1, v0, v1, seed) {
  const rows = Math.max(1, Math.round((v1 - v0) / 6));
  const rh = (v1 - v0) / rows;
  for (let r = 0; r < rows; r++) {
    let u = u0 - (r % 2) * 0.12;
    let k = 0;
    while (u < u1) {
      const wdt = 0.22 + hash2(seed, r, k) * 0.2;
      const a = Math.max(u, u0), b = Math.min(u + wdt, u1);
      const col = PAL.stone[Math.floor(hash2(seed, r, k + 50) * 3)];
      quad(c, F(a, v0 + r * rh), F(b, v0 + r * rh), F(b, v0 + (r + 1) * rh), F(a, v0 + (r + 1) * rh), col, 'rgba(50,45,40,0.55)', 0.8);
      u += wdt; k++;

  }
}

function blob(c, x, y, r, base, rnd) {

  c.fillStyle = g; ellipse(c, x, y, r, r * 0.92); c.fill();
  c.strokeStyle = 'rgba(30,40,15,0.45)'; c.lineWidth = 1; c.stroke();

    const a = rnd() * TAU, rr = rnd() * r * 0.85;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * 0.9;
    const up = (py < y) ? 0.3 : -0.25;
    c.fillStyle = shade(base, up * rnd()); ellipse(c, px, py, 1.6 + rnd() * 2, 1.2 + rnd() * 1.4); c.fill();
  }

  tc.strokeStyle = 'rgba(30,18,8,0.6)'; for (let i = 0; i < 6; i++) { const y = -6 - i * 9; line(tc, -2 + rnd() * 2, y, -1 + rnd() * 3, y - 6); }

function generateMap() {
  MAPS.vale = MAP = newMap('vale');
  srand = mulberry32(CFG.SEED);
  // terreno
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) {
    const x = i + 0.5, y = j + 0.5, k = j * MW + i;
    const pd = pathDist(x, y) - (fbm(x * 0.3, y * 0.3) - 0.5) * 0.9;
    const plaza = Math.hypot(x - PLAZA.x, y - PLAZA.y) - (fbm(x * 0.4 + 9, y * 0.4) - 0.5) * 1.6;
    let t = T_GRASS;
    if (pd < 1.15) t = inVillage(x, y) ? T_COBBLE : T_DIRT;
    if (plaza < PLAZA.r) t = T_COBBLE;
    for (const d of DENS) if (Math.hypot(x - d.x, y - d.y) < 2.6 + fbm(x, y) * 1.5) t = T_DIRT;
    MAP.tiles[k] = t;

    MAP.cobF[k] = t === T_COBBLE ? 1 : 0;
  }

  for (const h of HOUSES) {

    const o = addObj({ type: 'house', x: h.x, y: h.y, depth: h.x + h.y + (h.w + h.d) / 2, meta, h,
      box: { x0: h.x, y0: h.y, x1: h.x + h.w, y1: h.y + h.d } });
    addCollider({ x0: h.x, y0: h.y, x1: h.x + h.w, y1: h.y + h.d });
    for (let j = h.y - 1; j <= h.y + h.d; j++) for (let i = h.x - 1; i <= h.x + h.w; i++) MAP.occ[j * MW + i] = 1;
    o.smokeT = 0;

  // poço

  for (let j = 20; j < 25; j++) for (let i = 20; i < 25; i++) MAP.occ[j * MW + i] = 1;

  for (const [t, x, y] of props) {

    addCollider({ x, y, r: t === 'bush' ? 0.45 : 0.3 });
  }

  addObj({ type: 'banner', x: 38, y: 21 }); addCollider({ x: 38, y: 21, r: 0.3 });

  }

    for (const d of DENS) if (Math.hypot(x - d.x, y - d.y) < 4.5) return true;
    for (const c of CHESTS) if (Math.hypot(x - c.x, y - c.y) < 2) return true;

  };
  for (let j = 1; j < MH - 1; j++) for (let i = 1; i < MW - 1; i++) {

    const r = srand();
    if (MAP.tiles[j * MW + i] !== T_GRASS || blockedArea(x, y)) continue;

      continue;
    }
    const forest = fbm(x * 0.07 + 30, y * 0.07);
    if (r < (forest > 0.6 ? 0.3 : 0.035) && !occupied(x, y, 1)) {
      if (forest > 0.66 && srand() < 0.3) { addObj({ type: 'pine', x, y, v: Math.floor(srand() * 3), ph: srand() * TAU }); }

    else if (r > 0.957 && r < 0.966 && !occupied(x, y, 1)) { addObj({ type: 'rock', x, y, v: Math.floor(srand() * 3) }); addCollider({ x, y, r: 0.55 }); }
    else if (r > 0.95 && r < 0.954 && !occupied(x, y, 1)) { addObj({ type: 'stump', x, y }); addCollider({ x, y, r: 0.3 }); }

    const x = i + 0.5, y = j + 0.5;
    const bed = fbm(x * 0.13 + 100, y * 0.13 - 40);
    const grp = fbm(x * 0.25 - 70, y * 0.25 + 20);
    let n = 0, col = null;
    if (bed > 0.66) { n = 4 + Math.floor(hash2(i, j, 4) * 5); col = 'red'; }
    else if (grp > 0.6) { n = 1 + Math.floor(hash2(i, j, 5) * 3); col = ['#FFFFFF', '#F4D23C', '#F2A0C0', '#7FA8E8'][Math.floor(vnoise(x * 0.08, y * 0.08) * 4)]; }

    if (!n) continue;
    const arr = [];
    for (let f = 0; f < n; f++) {
      const c = col === 'red' ? (hash2(i, j, f + 20) < 0.8 ? '#C9302E' : '#E8574A') : col;
      arr.push({ x: i + hash2(i, j, f + 30), y: j + hash2(i, j, f + 40), c, ctr: col === '#F4D23C' ? '#C87A2A' : '#F2D04A' });
    }
    MAP.flowers[k] = arr;
  }
}

function serraTrailDist(x, y) {
  let m = 1e9; const t = SERRA.trail;

function generateSerra() {

    let t = T_GRASS;

    let burn = fbm(x * 0.075 + 11, y * 0.075 - 5) * 1.0 + (1 - (x + y) / 150) * 0.55 - 0.42;

    if (x < 1.5 || y < 1.5 || x > MW - 1.5 || y > MH - 1.5) continue;
    if (Math.abs(s) < 1.6) continue;

  }

  for (const s of [-1.2, 0, 1.2]) { const c = { x: B.x + s * 0.707, y: B.y - s * 0.707, r: 0.7 }; addCollider(c); fireCols.push(c); }

    if (Math.hypot(x - SERRA.top.x, y - SERRA.top.y) < 5.5 || Math.hypot(x - SERRA.start.x, y - SERRA.start.y) < 3) continue;
    if (SERRA.logs.some(l => Math.hypot(x - l.x, y - l.y) < 2.2)) continue;
    if (Math.abs((x + y) - (B.x + B.y)) < 1.4) continue;

    const dense = edge < 4.2 ? 0.7 : 0.3 + fbm(x * 0.09 + 3, y * 0.09) * 0.25;

      if (isAsh(x, y)) { addObj({ type: 'charred', x, y, v: Math.floor(srand() * 3), smolder: srand() < 0.25, st: 0 }); addCollider({ x, y, r: 0.32 }); }
      else { addObj({ type: 'spine', x, y, v: Math.floor(srand() * 3), ph: srand() * TAU }); addCollider({ x, y, r: 0.35 }); }

  }

// ENTIDADES — INIMIGO (com IA de máquina de estados)

    this.target = null; this.wait = rand(0, 2); this.fleeUsed = false; this.chargeCd = 2; this.hitPlayer = false;

  get frame() { const a = BEAST_ANIMS[this.anim]; const f = Math.floor(this.animT * a.fps); return a.loop ? f % a.n : Math.min(f, a.n - 1); }

        if (!this.hitPlayer && dist(this.x, this.y, p.x, p.y) < this.r + p.r + 0.35) { this.hitPlayer = true; p.takeDamage(C.dmg, this.x - this.cdx, this.y - this.cdy); }

        if (hit) {
          const s = worldToScreen(this.x, this.y); dust(s.x, s.y, 8); G.shake = Math.max(G.shake, 4);
          if (this.isBoar) { this.setState('stunned'); this.flash = 0; SFX.play('thud'); break; }
        }
        if (hit || this.stateT > maxT) { this.chargeCd = this.isBoar ? 2 : 4.5; this.atkCd = 0.6; this.setState('chase'); }
        break;
      }
      case 'stunned': {
        this.setAnim('hurt'); this.animT = 0;
        if (Math.random() < dt * 6) { const s = worldToScreen(this.x, this.y); fx({ type: 'circle', x: s.x + rand(-8, 8), y: s.y - 34, vy: -10, life: 0.5, size: 2, color: '#FFE48A' }); }
        if (this.stateT > 1.5) { this.chargeCd = 1.2; this.setState('chase'); }
        break;

      case 'flee': {

        break;

      case 'return': {

        if (pd < C.sight * 0.6 && this.hp > this.maxHp * 0.5) { this.setState('chase'); break; }

  startWindup(p, t) {

  die() {

// diálogo: lista de falas; opcionalmente escolhas na última fala
function openDialog(lines, onEnd, choices) { G.dialog = { lines, i: 0, chars: 0, onEnd, choices: choices || null, sel: 0 }; }
function chooseDialog(k) {

function updateDialog(dt) {

  const txt = d.lines[d.i];

  if (last && d.choices) {
    for (let k = 0; k < d.choices.length; k++) if (Input.hit('Digit' + (k + 1))) { chooseDialog(k); return; }
    if (Input.hit('KeyW') || Input.hit('ArrowUp')) d.sel = (d.sel + d.choices.length - 1) % d.choices.length;
    if (Input.hit('KeyS') || Input.hit('ArrowDown')) d.sel = (d.sel + 1) % d.choices.length;
    if (Input.hit('KeyF') || Input.hit('Space') || Input.hit('Enter')) chooseDialog(d.sel);
    return;

  if (Input.hit('KeyF') || Input.hit('Space') || Input.hit('Enter') || Input.mouseHit(0)) {
    if (d.chars < txt.length) d.chars = txt.length;

  for (const n of G.npcs) if (n.talk && (!n.canTalk || n.canTalk())) consider(dist(p.x, p.y, n.x, n.y), 1.7, { kind: 'npc', label: n.label || 'Falar', x: n.x, y: n.y, h: n.h || 78, use: () => n.talk() });

const Input = {

const BLOCK_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ControlLeft', 'ControlRight', 'F3', 'Tab', 'KeyW', 'KeyS', 'KeyA', 'KeyD']);

function updateCamera(dt, instant) {

function drawDialog(c) {
  const d = G.dialog, w = Math.min(760, W - 40), h = 120, x = (W - w) / 2, y = H - h - 110;

  c.fillStyle = g; c.fill(); c.restore();
  c.strokeStyle = '#8A6A3A'; c.lineWidth = 2; roundRect(c, x, y, w, h, 6); c.stroke();
  for (const sx of [x, x + w]) { const gg = c.createLinearGradient(sx - 10, 0, sx + 10, 0); gg.addColorStop(0, '#A8885A'); gg.addColorStop(0.5, '#E8D6AA'); gg.addColorStop(1, '#9A7A4A'); c.fillStyle = gg; roundRect(c, sx - 10, y - 8, 20, h + 16, 8); c.fill(); c.strokeStyle = '#6A4A2A'; c.stroke(); }
  for (let i = 0; i < 30; i++) { c.fillStyle = 'rgba(140,100,50,0.06)'; ellipse(c, x + hash2(i, 1) * w, y + hash2(i, 2) * h, 10 + hash2(i, 3) * 30, 6 + hash2(i, 4) * 10); c.fill(); }
  const raw = d.lines[d.i], stage = raw.startsWith('['), soft = raw.includes('(baixinho)');
  const full = stage ? raw.slice(1, -1) : raw.replace(' (baixinho)', '');
  const shown = full.slice(0, Math.floor(d.chars));
  c.font = `${stage || soft ? 'italic ' : ''}${soft ? 15 : 17}px ${SERIF}`; c.fillStyle = stage ? '#6A5034' : soft ? '#5A4630' : '#3A2614'; c.textAlign = 'left'; c.textBaseline = 'top';
  const words = shown.split(' '); let ln = '', yy = y + 22;
  for (const wd of words) { const t = ln ? ln + ' ' + wd : wd; if (c.measureText(t).width > w - 60) { c.fillText(ln, x + 30, yy); yy += 24; ln = wd; } else ln = t; }
  c.fillText(ln, x + 30, yy);
  const last = d.i === d.lines.length - 1 && d.chars >= full.length;
  if (last && d.choices) {   // escolhas (forja da Bruna)
    const ch = d.choices, rh = 30, cw = Math.min(460, w - 40), cx = x + w - cw - 20, cy = y - ch.length * (rh + 6) - 10;
    ch.forEach((o, k) => {
      const yy = cy + k * (rh + 6), hov = uiHover({ x: cx, y: yy, w: cw, h: rh });
      if (hov) d.sel = k;
      uiButton('choice' + k, cx, yy, cw, rh, () => chooseDialog(k));
      drawPanel(c, cx, yy, cw, rh, d.sel === k ? 0.95 : 0.8);
      text(c, `${k + 1}. ${o.label}`, cx + 14, yy + rh / 2 + 1, 15, d.sel === k ? '#FFE9A0' : '#F2E6C8', 'left', d.sel === k);
    });
  } else if (d.chars >= full.length && Math.floor(G.time * 2) % 2 === 0) { c.textAlign = 'right'; c.fillStyle = '#7A4A1A'; c.fillText('F ▶', x + w - 26, y + h - 30); }
}

const SAVE_KEY = 'dunwick_save_v1';
function saveProgress(phase) {
  const p = G.player;
  G.save = { phase, level: p.level, xp: p.xp, xpNext: p.xpNext, maxHp: p.maxHp, dmg: p.dmg, bonusDmg: p.bonusDmg,
    spinLevel: p.spinLevel, coins: G.coins, bought: Object.assign({}, G.bought), flags: Object.assign({}, G.flags) };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); } catch (e) { /* armazenamento indisponível */ }
}
function loadSave() {

}

function buildRaidPath(e) {
  const h = HOUSES[randi(0, HOUSES.length - 1)];
  const door = { x: h.x + h.w / 2 + rand(-0.8, 0.8), y: h.y + h.d + 0.75 };
  const path = [];
  if (e.x > GATE.x) path.push({ x: 36.5, y: 22 }, { x: 32.5, y: 22 });
  else if (e.y > VILLAGE.y1) path.push({ x: 22, y: 37 }, { x: 22, y: 32.5 });
  if (door.x < 24 && door.y < 27) path.push({ x: 22.5, y: 25.6 });
  path.push(door);
  return path;
}
Enemy.prototype.updateRaid = function (dt, p, pd) {
  if (pd < 4.5) { this.setState('chase'); return; }
  if (!this.path) this.path = buildRaidPath(this);
  if (this.state === 'raid') {
    const tg = this.path[0];
    if (!tg) { this.setState('raidAttack'); return; }
    if (dist(this.x, this.y, tg.x, tg.y) < 0.6) { this.path.shift(); return; }
    const ox_ = this.x, oy_ = this.y;
    this.moveDir(tg.x - this.x, tg.y - this.y, this.isBoar ? 2.4 : 3.0, dt); this.setAnim('run');
    // preso numa parede: se for de uma casa, ataca ela mesmo; senão recalcula o caminho
    this.stuckT = Math.hypot(this.x - ox_, this.y - oy_) < 0.5 * dt ? (this.stuckT || 0) + dt : 0;
    if (this.stuckT > 1.2) {
      const nearHouse = HOUSES.some(h => Math.hypot(this.x - clamp(this.x, h.x, h.x + h.w), this.y - clamp(this.y, h.y, h.y + h.d)) < 1.0);
      if (nearHouse) this.setState('raidAttack'); else { this.path = null; this.stuckT = 0; }
    }
    if (this.stateT > 14) { this.path = null; this.stateT = 0; }
  } else {
    // atacando uma casa
    const P2 = G.p2; if (!P2) return;
    this.setAnim(Math.floor(this.stateT / 0.6) % 2 ? 'attack' : 'idle');
    P2.villageHp = Math.max(0, P2.villageHp - (this.isBoar ? 1.6 : 1.1) * dt);
    P2.hitFlash = 0.3;
    if (Math.random() < dt * 4) { const s = worldToScreen(this.x, this.y - 0.6); fx({ type: 'spark', x: s.x + rand(-10, 10), y: s.y - 20, vx: rand(-30, 30), vy: rand(-90, -40), life: 0.5, size: 1.5, color: '#FF9A3A', drag: 2 }); }
  }
};
Enemy.prototype.updateCornered = function (dt, p, pd, toP) {
  const C = this.cfg;
  switch (this.state) {
    case 'patrol': case 'alert': case 'return': {
      if (pd < C.sight) { this.setState('flee'); this.blockedT = 0; break; }
      if (this.wait > 0) { this.wait -= dt; this.setAnim('idle'); break; }
      if (!this.target) this.target = { x: this.homeX + rand(-3, 3), y: this.homeY + rand(-3, 3) };
      if (dist(this.x, this.y, this.target.x, this.target.y) < 0.4 || this.stateT > 6) { this.target = null; this.wait = rand(1, 3); this.stateT = 0; break; }
      this.moveDir(this.target.x - this.x, this.target.y - this.y, C.patrolSpeed, dt); this.setAnim('walk');
      break;
    }
    case 'cornered': {
      this.setAnim('idle'); this.dir = dirFromWorld(toP.x, toP.y); this.flash = (Math.floor(this.stateT * 6) % 2) * 0.12;
      if (pd < C.range + 0.4 && this.atkCd <= 0) { this.setState('bite'); this.setAnim('attack'); this.hitPlayer = false; break; }
      if (pd > 3 || this.stateT > 2.5) { this.setState('flee'); this.blockedT = 0; }
      break;
    }
    case 'bite': {
      if (this.stateT > 0.3 && !this.hitPlayer) { this.hitPlayer = true; if (dist(this.x, this.y, p.x, p.y) < C.range + 0.4 && p.takeDamage(C.dmg, this.x, this.y)) SFX.play('bite'); }
      if (this.stateT > 0.6) { this.atkCd = 1.4; this.setState('flee'); this.blockedT = 0; }
      break;
    }
    case 'hurt': this.setAnim('hurt'); if (this.stateT > 0.2) this.setState(pd < 1.8 ? 'cornered' : 'flee'); break;
    default: { // fugir: para longe do jogador, de preferência morro abaixo
      if (pd > 9) { this.setState('patrol'); this.homeX = this.x; this.homeY = this.y; break; }
      const l = Math.max(pd, 0.01), fxv = -toP.x / l + 0.55, fyv = -toP.y / l + 0.55;
      const hit = this.moveDir(fxv, fyv, C.speed, dt); this.setAnim('run');
      this.blockedT = hit ? (this.blockedT || 0) + dt : Math.max(0, (this.blockedT || 0) - dt * 0.5);
      if (this.blockedT > 0.4 || pd < 1.1) this.setState('cornered');
      if (!G.flags.saidFlee && pd < 7 && !G.dialog && G.phase === 3) { G.flags.saidFlee = true; later(0.6, () => { if (!G.dialog) openDialog(S3_CORNERED_FLEE); }); }
    }
  }
};
Enemy.prototype.updateStomp = function (dt, p, pd) {
  this.setAnim('idle'); this.flash = this.stateT < 0.55 ? (Math.floor(this.stateT * 14) % 2) * 0.3 : 0;
  if (this.stateT > 0.55 && !this.stomped) {
    this.stomped = true; G.shake = Math.max(G.shake, 9); SFX.play('thud');
    const s = worldToScreen(this.x, this.y);
    fx({ type: 'ring', x: s.x, y: s.y, size: 20, grow: 220, life: 0.45, color: '#FF8A3A' }); dust(s.x, s.y, 14, 1.4);
    if (pd < 2.7) p.takeDamage(this.cfg.dmg, this.x, this.y);
    for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + rand(-0.3, 0.3), r = rand(1.4, 3.2); G.hazards.push({ x: this.x + Math.cos(a) * r, y: this.y + Math.sin(a) * r, r: 0.55, t: 4.5, max: 4.5 }); }
  }
  if (this.stateT > 0.95) { this.stomped = false; this.stompCd = 4.5; this.setState('chase'); }
};
function updateHazards(dt, p) {

    const h = G.hazards[i]; h.t -= dt;

// queimaduras: manchas nos lobos e brasas no lombo do javali-rei
function drawBurnMarks(c, e, x, y, alpha) {

function buildTufts() {
  const TUFTS = MAP.tufts = new Float32Array(MW * MH * 6 * 4), TUFT_N = MAP.tuftN = new Uint8Array(MW * MH);
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) {
    const k = j * MW + i;
    if (MAP.tiles[k] !== T_GRASS || (MAP.ashF && MAP.ashF[k] > 0.42)) continue;
    const n = 3 + Math.floor(hash2(i, j, 11) * 4); TUFT_N[k] = n;
    for (let t = 0; t < n; t++) {
      const o = (k * 6 + t) * 4, s = worldToScreen(i + hash2(i, j, 12 + t), j + hash2(i, j, 20 + t));
      TUFTS[o] = s.x; TUFTS[o + 1] = s.y; TUFTS[o + 2] = 3 + hash2(i, j, 30 + t) * 3; TUFTS[o + 3] = hash2(i, j, 40 + t) < 0.55 ? 0 : 1;
    }
  }
}

function drawFlag(c, x, y, w, h, t, ph, hang) {

  c.restore();
}

function entDepth(x, y) {

function updateAmbient(dt) {

  // pólen / vaga-lumes
  const serra = MAP.kind === 'serra';
  let n = 0; for (const p of G.fx) if (p.type === 'pollen' || p.type === 'ash' || p.type === 'ember') n++;
  for (; n < 55; n++) {
    if (serra) {   // cinzas caindo e brasas subindo na serra
      const ember = Math.random() < 0.25;
      fx({ type: ember ? 'ember' : 'ash', x: G.cam.x + rand(-W / 2, W / 2), y: G.cam.y + rand(-H / 2, H / 2), vx: rand(6, 18), vy: ember ? rand(-30, -10) : rand(8, 22), life: rand(3, 7), size: rand(1, 2), alpha: 0.8,
        update: p => { p.vx = 12 * G.wind + Math.sin(G.time * 2 + p.size * 7) * 6; } });
      continue;
    }
    fx({ type: 'pollen', x: G.cam.x + rand(-W / 2, W / 2), y: G.cam.y + rand(-H / 2, H / 2), vx: rand(6, 18), vy: rand(-6, 3), life: rand(4, 8), size: rand(0.8, 1.6), alpha: 0.8,

  }
  // fumaça das chaminés
  for (const o of MAP.objects) {
    if (o.type !== 'house') continue;
    const sx = o.sx + o.meta.chimney.x, sy = o.sy + o.meta.chimney.y;
    if (Math.abs(sx - G.cam.x) > W || Math.abs(sy - G.cam.y) > H) continue;
    o.smokeT -= dt;
    if (o.smokeT <= 0) {

const LOAD_STEPS = [];

  LOAD_STEPS.push(() => buildCharacterAssets());

  LOAD_STEPS.push(() => generateMap());
  LOAD_STEPS.push(() => buildTufts());

  for (let cj = 0; cj < nc; cj++) for (let ci = 0; ci < nc; ci++) LOAD_STEPS.push(() => MAP.chunks.push(genChunk(ci, cj)));

let lastT = performance.now();
function frame(now) {
  const dt = clamp((now - lastT) / 1000, 0, 0.05); lastT = now;
  if (dt > 0) G.fps = lerp(G.fps, 1 / dt, 0.05);
  UI_BUTTONS = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  if (Input.hit('F3')) G.debug = !G.debug;

  try {
  switch (G.state) {
    case 'loading': {
      const t0 = performance.now();
      while (loadIndex < LOAD_STEPS.length && performance.now() - t0 < 30) LOAD_STEPS[loadIndex++]();
      withUI(() => drawLoading(ctx, loadIndex / LOAD_STEPS.length));
      if (loadIndex >= LOAD_STEPS.length) { const cb = G.afterLoad; G.afterLoad = null; cb(); }
      break;
    }
    case 'title': {
      G.time += dt;
      updateAmbient(dt); updateFX(dt);
      const s = worldToScreen(30 + Math.sin(G.time * 0.05) * 8, 26 + Math.cos(G.time * 0.04) * 6);
      G.cam.x = s.x; G.cam.y = s.y;
      drawWorld(ctx, G.time);
      withUI(() => drawTitle(ctx));

    }
    case 'playing': {
      TouchCtl.update(dt);
      if (Input.hit('Escape')) { if (G.bigMap) G.bigMap = false; else { G.state = 'paused'; break; } }
      if (Input.hit('KeyM')) G.bigMap = !G.bigMap;
      if (Input.hit('KeyN')) { G.dayNight = !G.dayNight; showMessage(G.dayNight ? 'Ciclo dia/noite ligado' : 'Ciclo dia/noite desligado', 1.5); }
      let sdt = dt;
      if (G.hitstop > 0) { G.hitstop -= dt; sdt = 0; }
      if (sdt > 0 && !G.dialog) {
        G.time += sdt;
        const p = G.player;
        p.update(sdt);
        for (const e of G.enemies) e.update(sdt, p);
        // separação entre inimigos
        for (let a = 0; a < G.enemies.length; a++) for (let b = a + 1; b < G.enemies.length; b++) {
          const A = G.enemies[a], B = G.enemies[b]; if (A.dead || B.dead) continue;
          const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy), m = A.r + B.r;
          if (d > 0 && d < m) { const push = (m - d) * 0.5; moveCollide(A, -dx / d * push, -dy / d * push, A.r); moveCollide(B, dx / d * push, dy / d * push, B.r); }
        }
        // inimigos não atravessam o jogador

          const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy), m = e.r + p.r + 0.15;

        }

        updateItems(sdt, p);
        updateFX(sdt);
        updateAmbient(sdt);

        PHASES[G.phase].update(sdt);
        if (G.card) { G.card.t -= sdt; if (G.card.t <= 0) G.card = null; }
        if (G.alpha && G.alpha.dead && !G.endingStarted) { G.alphaDeadT += sdt; if (G.alphaDeadT > 2.5 && !G.dialog) alphaAftermath(); }
      }

      drawWorld(ctx, G.time);
      withUI(() => { drawHUD(ctx); if (G.touch) { TouchCtl.layout(); TouchCtl.draw(ctx); } });
      break;
    }
    case 'paused': {
      drawWorld(ctx, G.time);
      withUI(() => drawHUD(ctx));
      withUI(() => drawOverlayScreen(ctx, 'Pausado', `Fase ${G.phase}: ${PHASE_INFO[G.phase].title}`, 'rgba(10,8,4,0.6)', [['resume', 'Continuar', () => { G.state = 'playing'; }], ['restart', 'Reiniciar fase', () => startPhase(G.phase)], ['menu', 'Menu', () => goTitle()]]));

      withUI(() => drawOverlayScreen(ctx, di.title, di.sub, 'rgba(60,8,6,0.55)', [['retry', 'Tentar de novo', () => startPhase(G.phase)], ['menu', 'Menu', () => goTitle()]]));

    }
  }
  } catch (err) { console.error(err); }
  Input.endFrame();
  requestAnimationFrame(frame);
}

function goTitle() { if (MAPS.vale) MAP = MAPS.vale; initGame(1); G.state = 'title'; }

setupLoading();
requestAnimationFrame(frame);
</script>
